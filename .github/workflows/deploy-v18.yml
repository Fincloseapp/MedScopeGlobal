name: Deploy V18 (disabled — Cloudflare only)

# Production: .github/workflows/cloudflare-deploy.yml / pnpm cf:deploy
# Vercel deploys are not used.

on:
  workflow_dispatch:

jobs:
  cloudflare-only:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse Vercel
        run: |
          echo "V18 Vercel deploy is disabled."
          echo "Production: Cloudflare Workers (medscopeglobal.com)"
          echo "Use: pnpm cf:deploy or workflow cloudflare-deploy.yml"
          exit 1
