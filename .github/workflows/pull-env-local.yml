name: Pull Production Env Local

on:
  workflow_dispatch:

jobs:
  pull-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel production env
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "Missing VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID in Actions secrets"
            exit 1
          fi
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          if [ -f .vercel/.env.production.local ]; then
            cp .vercel/.env.production.local ./medscope.env.local
          elif [ -f .env.production.local ]; then
            cp .env.production.local ./medscope.env.local
          else
            vercel env pull ./medscope.env.local --environment=production --token="$VERCEL_TOKEN" --yes
          fi
          test -s ./medscope.env.local
          echo "env_lines=$(wc -l < ./medscope.env.local)"
          # Key names only — never print values
          echo "env_keys:"
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' ./medscope.env.local | cut -d= -f1 | sort -u

      - name: Upload env artifact
        uses: actions/upload-artifact@v4
        with:
          name: medscope-env-local
          path: medscope.env.local
          retention-days: 7
          if-no-files-found: error
