name: Pull Production Env Local

# Production env lives on Cloudflare Workers.

on:
  workflow_dispatch:

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: Cloudflare-only env
        run: |
          echo "Use local .env.local / D:\\medscope.local and: pnpm cf:env:sync"
          echo "Worker: medscopeglobal (wrangler.jsonc)"
          echo "Site: https://medscopeglobal.com"
          exit 1
