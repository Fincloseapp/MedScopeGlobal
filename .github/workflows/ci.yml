name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Validate (v24 structure + gates)
        run: pnpm run validate

      - name: Build (Cloudflare / OpenNext pipeline)
        env:
          NEXT_PUBLIC_SITE_URL: https://medscopeglobal.com
          MEDSCOPE_RUNTIME: cloudflare-workers
        run: pnpm run build

  cloudflare-production:
    name: live Cloudflare host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert medscopeglobal.com is Cloudflare, not Vercel
        run: node scripts/cloudflare/assert-live-host.mjs
