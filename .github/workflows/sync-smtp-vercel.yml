name: Sync SMTP (Cloudflare)

# SMTP for medscopeglobal.com is Cloudflare Email Sending.
# Worker secrets live in Cloudflare (pnpm cf:env:sync / dashboard), not Vercel.

on:
  workflow_dispatch:

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: Cloudflare-only SMTP
        run: |
          echo "Do not sync SMTP to Vercel."
          echo "Set SMTP_* on the Cloudflare Worker (pnpm cf:env:sync or dashboard bindings)."
          echo "Host: smtp.mx.cloudflare.net"
          echo "Site: https://medscopeglobal.com"
