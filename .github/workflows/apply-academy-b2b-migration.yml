name: Apply Academy B2B CME Migration

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/migrations/20260718120000_academy_b2b_cme.sql"
      - "supabase/migrations/20260718120100_academy_b2b_cme_seed.sql"
      - "scripts/ci-apply-academy-b2b-migration.mjs"
      - ".github/workflows/apply-academy-b2b-migration.yml"
    branches:
      - main

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools
        run: npm install pg@8.13.1 --no-save

      - name: Apply B2B CME SQL migrations
        id: apply_sql
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }}
        run: node scripts/ci-apply-academy-b2b-migration.mjs

      - name: Fallback via production setup API
        if: steps.apply_sql.outcome != 'success'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "${CRON_SECRET:-}"
          body="$(curl -sS -w "\nHTTP_STATUS:%{http_code}" "https://medscopeglobal.com/api/setup/academy-b2b-schema?secret=${CRON_SECRET}")"
          echo "$body"
          echo "$body" | grep -q 'HTTP_STATUS:200'
          echo "Fallback setup API OK"
