name: Production Setup

# Production is Cloudflare Workers only. Prisma/migrations use GitHub secrets.
# Deploys: cloudflare-deploy.yml (push to main) or pnpm cf:deploy.

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate database connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo "Missing DATABASE_URL or DIRECT_URL repository secrets."
            exit 1
          fi
          if echo "$DATABASE_URL$DIRECT_URL" | grep -q '\[PASSWORD\]'; then
            echo "Connection strings still contain [PASSWORD] placeholder."
            exit 1
          fi
          npx prisma migrate deploy
          node prisma/seed.mjs

      - name: Production deploy is Cloudflare Workers
        run: |
          echo "Vercel is not used."
          echo "Deploy: GitHub Actions cloudflare-deploy.yml or pnpm cf:deploy"
          echo "Site: https://medscopeglobal.com"
