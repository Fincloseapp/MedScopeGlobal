name: Vercel Auto Deploy (disabled)

# Production is Cloudflare Workers only — see cloudflare-deploy.yml and wrangler.jsonc.
# This workflow is kept as documentation; it does not deploy anything.

on:
  workflow_dispatch:

concurrency:
  group: vercel-auto-deploy-main
  cancel-in-progress: false

jobs:
  cloudflare-production-note:
    runs-on: ubuntu-latest
    steps:
      - name: Production deploy via Cloudflare Workers
        run: |
          echo "Production deploy path: Cloudflare Workers (OpenNext)"
          echo "Project: medscopeglobal (wrangler.jsonc)"
          echo "Domain:  https://medscopeglobal.com"
          echo "Branch:  main (production)"
          echo ""
          echo "Automatic deploy on push to main:"
          echo "  - .github/workflows/cloudflare-deploy.yml (GitHub Actions)"
          echo "  - Cloudflare Workers Builds dashboard (Build: npm run cf:build, Deploy: opennextjs-cloudflare deploy)"
          echo ""
          echo "Vercel Git Integration is no longer used for production."
