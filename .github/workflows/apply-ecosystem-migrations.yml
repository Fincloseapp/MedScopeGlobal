name: Apply Ecosystem Migrations

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/migrations/20260825120000_mediflow_ecosystem.sql"
      - "supabase/migrations/20260825220000_editorial_redakce.sql"
      - "supabase/migrations/20260825230000_editorial_images.sql"
      - "scripts/ci-apply-ecosystem-migrations.mjs"
      - ".github/workflows/apply-ecosystem-migrations.yml"
    branches:
      - main

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pg (optional Postgres path)
        run: npm install pg@8.13.1 --no-save

      - name: Apply ecosystem SQL migrations
        id: apply_sql
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: https://xcydgqnivxfhprbmdyym.supabase.co
        run: node scripts/ci-apply-ecosystem-migrations.mjs

      - name: Fallback via production cron API
        if: steps.apply_sql.outcome != 'success'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "${CRON_SECRET:-}"
          body="$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://medscopeglobal.com/api/cron/apply-ecosystem-migrations")"
          echo "$body"
          echo "$body" | grep -q 'HTTP_STATUS:200'

      - name: Verify ecosystem tables exist
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://xcydgqnivxfhprbmdyym.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          base="${NEXT_PUBLIC_SUPABASE_URL}/rest/v1"
          key="${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
          for table in mediflow_notes article_syndications article_image_suggestions; do
            code="$(curl -sS -o /tmp/tbl.json -w "%{http_code}" \
              -H "apikey: ${key}" -H "Authorization: Bearer ${key}" \
              "${base}/${table}?select=id&limit=1")"
            echo "${table}: HTTP ${code}"
            test "${code}" = "200"
          done
