name: Cloudflare Workers Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secrets CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID."
            echo "Add them under Settings → Secrets and variables → Actions, then re-run this workflow."
            echo "Alternatively use Cloudflare Workers Builds with:"
            echo "  Project name: medscopeglobal"
            echo "  Build command: npm run cf:build"
            echo "  Deploy command: npx opennextjs-cloudflare deploy"
            exit 1
          fi

      - name: Enable corepack
        run: corepack enable

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Write Cloudflare secrets file
        env:
          CLOUDFLARE_ENV_JSON: ${{ secrets.CLOUDFLARE_ENV_JSON }}
        run: |
          if [ -z "$CLOUDFLARE_ENV_JSON" ]; then
            echo "CLOUDFLARE_ENV_JSON not set — using dashboard bindings plus minimal .dev.vars"
            printf '%s\n' \
              "NEXTJS_ENV=production" \
              "NEXT_PUBLIC_SITE_URL=https://medscopeglobal.com" \
              "MEDSCOPE_RUNTIME=cloudflare-workers" \
              > .dev.vars
          else
            node scripts/cloudflare/write-dev-vars-from-json.mjs
          fi

      - name: Build + deploy OpenNext to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run cf:deploy

      - name: Smoke
        run: node scripts/cloudflare/smoke-production.mjs
