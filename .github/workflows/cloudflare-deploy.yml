name: Cloudflare Workers Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Write Cloudflare secrets file
        env:
          CLOUDFLARE_ENV_JSON: ${{ secrets.CLOUDFLARE_ENV_JSON }}
        run: |
          if [ -z "$CLOUDFLARE_ENV_JSON" ]; then
            echo "CLOUDFLARE_ENV_JSON secret missing"
            exit 1
          fi
          node scripts/cloudflare/write-dev-vars-from-json.mjs

      - name: Build + deploy OpenNext to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy

      - name: Smoke
        run: node scripts/cloudflare/smoke-production.mjs