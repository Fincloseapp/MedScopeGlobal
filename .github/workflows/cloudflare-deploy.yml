name: Cloudflare Workers Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secrets CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID."
            echo ""
            echo "One-time setup (GitHub repo Fincloseapp/MedScopeGlobal):"
            echo "  Settings → Secrets and variables → Actions → New repository secret"
            echo "    CLOUDFLARE_API_TOKEN  — user-scoped token with Workers Scripts Edit"
            echo "    CLOUDFLARE_ACCOUNT_ID — d3108976a0c396327ce8eb87d9f71c0c"
            echo "  Optional: CLOUDFLARE_ENV_JSON — JSON object of build-time secrets for .dev.vars"
            echo ""
            echo "Preferred zero-secret path: Cloudflare Workers Builds (dashboard, see docs/cloudflare-auto-deploy.md):"
            echo "  Worker medscopeglobal → Settings → Builds → Connect Fincloseapp/MedScopeGlobal"
            echo "  Production branch: main"
            echo "  Build:  npm run cf:build"
            echo "  Deploy: npx opennextjs-cloudflare deploy"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.4 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Write Cloudflare secrets file
        env:
          CLOUDFLARE_ENV_JSON: ${{ secrets.CLOUDFLARE_ENV_JSON }}
        run: |
          if [ -z "$CLOUDFLARE_ENV_JSON" ]; then
            echo "CLOUDFLARE_ENV_JSON not set — using dashboard bindings plus minimal .dev.vars"
            printf '%s\n' \
              "NEXTJS_ENV=production" \
              "NEXT_PUBLIC_SITE_URL=https://medscopeglobal.com" \
              "MEDSCOPE_RUNTIME=cloudflare-workers" \
              > .dev.vars
          else
            node scripts/cloudflare/write-dev-vars-from-json.mjs
          fi

      - name: Build + deploy OpenNext to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm cf:deploy

      - name: Smoke
        run: node scripts/cloudflare/smoke-production.mjs
