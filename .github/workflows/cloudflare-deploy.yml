name: Cloudflare Workers Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Choose deploy path
        id: auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "GitHub Actions will deploy with the stored API token."
          else
            echo "mode=workers-builds" >> "$GITHUB_OUTPUT"
            echo "No CLOUDFLARE_API_TOKEN in GitHub secrets — that is expected."
            echo "Production deploy is Cloudflare Workers Builds (platform auth, no token in GitHub)."
            echo "Worker: medscopeglobal"
            echo "Build: npm run cf:build"
            echo "Deploy: npx opennextjs-cloudflare deploy"
            echo "https://dash.cloudflare.com/?to=/:account/workers/services/view/medscopeglobal"
          fi

      - name: Enable corepack
        if: steps.auth.outputs.mode == 'token'
        run: corepack enable

      - uses: pnpm/action-setup@v4
        if: steps.auth.outputs.mode == 'token'
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        if: steps.auth.outputs.mode == 'token'
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        if: steps.auth.outputs.mode == 'token'
        run: pnpm install --frozen-lockfile

      - name: Write Cloudflare secrets file
        if: steps.auth.outputs.mode == 'token'
        env:
          CLOUDFLARE_ENV_JSON: ${{ secrets.CLOUDFLARE_ENV_JSON }}
        run: |
          if [ -z "$CLOUDFLARE_ENV_JSON" ]; then
            echo "CLOUDFLARE_ENV_JSON not set — using dashboard bindings plus minimal .dev.vars"
            printf '%s\n' \
              "NEXTJS_ENV=production" \
              "NEXT_PUBLIC_SITE_URL=https://medscopeglobal.com" \
              "MEDSCOPE_RUNTIME=cloudflare-workers" \
              > .dev.vars
          else
            node scripts/cloudflare/write-dev-vars-from-json.mjs
          fi

      - name: Build + deploy OpenNext to Cloudflare Workers
        if: steps.auth.outputs.mode == 'token'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run cf:deploy

      - name: Smoke
        if: steps.auth.outputs.mode == 'token'
        run: node scripts/cloudflare/smoke-production.mjs
